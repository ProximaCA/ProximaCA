name: vitals

on:
  schedule:
    - cron: "33 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/vitals.py", ".github/workflows/vitals.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: heartbeat
        run: python3 .github/scripts/vitals.py dist ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#efe6da&color_dots=#161b22,#4a0a14,#80111f,#c0152e,#ff1a3c
            dist/snake-light.svg?color_snake=#0d0d0d&color_dots=#ebedf0,#f7c1c9,#ec8797,#d93a55,#a8001c

      - name: publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
